<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checklist de Produto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">

    <h1 id="tituloEditavel"
        class="h3 mb-1"
        contenteditable="true"
        spellcheck="false"
        aria-label="Título do item que está sendo editado"
        data-placeholder="Clique aqui e digite o título...">Novo produto</h1>
    <p class="text-secondary small mb-4">
      <i class="bi bi-pencil"></i> O título acima é editável.
    </p>

    <div class="card shadow-sm">
      <div class="card-header d-flex justify-content-between align-items-center bg-white">
        <span class="fw-semibold">Itens</span>
        <span id="contador" class="badge text-bg-secondary">0 / 0</span>
      </div>

      <ul class="list-group list-group-flush" id="listaItens"></ul>

      <div class="card-footer bg-white d-flex flex-wrap align-items-center gap-2">
        <button type="button" class="btn btn-primary btn-sm" id="btnGuardar"
                title="Guardar no JSON (Shift + clique para escolher outro arquivo)">
          <i class="bi bi-save"></i> Guardar
        </button>
        <button type="button" class="btn btn-outline-danger btn-sm" id="btnReset">
          <i class="bi bi-arrow-counterclockwise"></i> Reset checked
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="btnMarcarTodos">
          <i class="bi bi-check2-all"></i> Marcar todos
        </button>
        <span id="arquivoAtual" class="text-secondary small ms-auto">
          <i class="bi bi-file-earmark-code"></i> Nenhum arquivo escolhido
        </span>
      </div>
    </div>

  </main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="aviso" class="toast align-items-center border-0" role="alert" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="avisoTexto"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
